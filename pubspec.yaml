name: cloud_pocket
description: A mobile-based personal file-sharing server for Android.
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.5.0

  # UI & QR
  cupertino_icons: ^2.0.0
  pretty_qr_code: ^3.1.0

  # File and System Utilities
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  path_provider: ^2.1.1
  permission_handler: ^13.0.2
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Embedded Server & Networking
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  mime: ^2.1.0
  crypto: ^3.0.3
  uuid: ^4.2.1
  http: ^1.1.0

  # Platform Services
  flutter_foreground_task: ^11.0.3
  connectivity_plus: ^7.3.2
  image: ^4.10.1
  open_filex: ^5.0.0
  curved_navigation_bar: ^1.0.6
  mobile_scanner: ^7.5.0
  pointycastle: ^4.0.0
  # v10 migrates the encrypted preferences used by the published v1.0.3 APKs.
  flutter_secure_storage: ^10.0.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/images/
    - assets/guide/

