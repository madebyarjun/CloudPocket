plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('key.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseSigningProperties.getProperty(it)?.trim()
}
// Explicit local testing only. Production builds still require the private key.
def localTestRelease = System.getenv('CLOUDPOCKET_LOCAL_TEST_RELEASE') == '1'
def prepareUnsignedRelease = project.findProperty('prepareUnsignedRelease') == 'true'
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasReleaseSigning && !localTestRelease && !prepareUnsignedRelease) {
    throw new GradleException('Release signing requires android/key.properties with storeFile, storePassword, keyAlias, and keyPassword. Debug signing is never used for releases.')
}

android {
    namespace "com.cloudpocket.app.cloud_pocket"
    compileSdk = 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.cloudpocket.app.cloud_pocket"
        minSdkVersion 26
        targetSdk = flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            // Flutter's x86_64 debug engine is needed by the local emulator.
            if (!project.hasProperty('split-per-abi')) {
                ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
            }
        }
        release {
            signingConfig prepareUnsignedRelease ? null : (localTestRelease ? signingConfigs.debug : signingConfigs.release)
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // Preserve the verified upstream tunnel executables byte for byte.
            keepDebugSymbols += ['**/libcloudflared.so']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {}
